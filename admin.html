
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>إدارة Smart Wallet</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 18px;
      background: #f1f5f9;
      color: #172033;
      font-family: Arial, sans-serif;
    }
    .container { max-width: 1050px; margin: auto; }
    .card {
      background: white;
      padding: 20px;
      margin-bottom: 18px;
      border-radius: 14px;
      box-shadow: 0 3px 14px #0000000a;
    }
    h1, h2 { margin-top: 0; }
    input {
      display: block;
      width: 100%;
      padding: 13px;
      margin: 10px 0;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      padding: 11px 16px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      margin: 3px;
    }
    .primary { background: #155eef; color: white; }
    .approve { background: #15803d; color: white; }
    .reject { background: #b91c1c; color: white; }
    .secondary { background: #e2e8f0; color: #172033; }
    .hidden { display: none !important; }
    #message { white-space: pre-wrap; overflow-wrap: anywhere; }
    .error { color: #b91c1c; }
    .success { color: #15803d; }
    .muted { color: #64748b; font-size: 13px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 700px; }
    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid #e2e8f0;
      text-align: right;
      vertical-align: top;
    }
    th { background: #f8fafc; }
    .status { font-weight: bold; }
    .pending { color: #a16207; }
    .approved { color: #15803d; }
    .rejected { color: #b91c1c; }
    .request { overflow-wrap: anywhere; }
  </style>
</head>
<body>
<div class="container">
  <div class="card">
    <h1>إدارة Smart Wallet</h1>
    <p class="muted">لوحة إدارة طلبات الإيداع والسحب</p>
    <div id="message" role="status"></div>
  </div>

  <section class="card" id="loginCard">
    <h2>تسجيل دخول الإدارة</h2>
    <input id="phone" type="tel" autocomplete="username"
      placeholder="رقم الهاتف">
    <input id="password" type="password" autocomplete="current-password"
      placeholder="كلمة المرور">
    <button class="primary" id="loginButton" onclick="signIn()">
      تسجيل الدخول
    </button>
  </section>

  <section id="dashboard" class="hidden">
    <div class="card">
      <h2>لوحة التحكم</h2>
      <p id="adminInfo"></p>
      <button class="primary" onclick="loadRequests()">تحديث الطلبات</button>
      <button class="secondary" onclick="signOut()">تسجيل الخروج</button>
    </div>

    <div class="card">
      <h2>طلبات الإيداع والسحب</h2>
      <p class="muted">
        راجع الطلب وتحقق من الدفع أو من أهلية السحب قبل الموافقة.
      </p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>التاريخ</th>
              <th>رقم المستخدم</th>
              <th>النوع</th>
              <th>المبلغ</th>
              <th>الطريقة</th>
              <th>المرجع</th>
              <th>الحالة</th>
              <th>الإجراء</th>
            </tr>
          </thead>
          <tbody id="requestsBody">
            <tr><td colspan="8">سجّل الدخول لعرض الطلبات.</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>
</div>

<script>
  // إعدادات مشروع Supabase الحالي
  const SUPABASE_URL = "https://sjhjxbnhhwftwlkshpql.supabase.co";
  const SUPABASE_KEY = "sb_publishable_6880OlVMxWIDPJfqwFS5TA_m7FCMQZK";

  const sb = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  let currentUser = null;
  let busy = false;

  function showMessage(text, type = "") {
    const el = document.getElementById("message");
    el.textContent = text;
    el.className = type;
  }

  function normalizedPhone(value) {
    return String(value || "").replace(/\D/g, "");
  }

  // يجب أن تطابق هذه الصيغة صيغة تسجيل الدخول في index.html
  function phoneToEmail(phone) {
    return normalizedPhone(phone) + "@phone.smartwallet.invalid";
  }

  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, function(ch) {
      return {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[ch];
    });
  }

  function money(value) {
    return Number(value || 0).toLocaleString("ar-EG", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }) + " ج.م";
  }

  function statusText(status) {
    if (status === "pending") return "قيد المراجعة";
    if (status === "approved") return "مقبول";
    if (status === "rejected") return "مرفوض";
    return status || "غير معروف";
  }

  async function signIn() {
    if (busy) return;

    const phone = normalizedPhone(document.getElementById("phone").value);
    const password = document.getElementById("password").value;

    if (!phone || !password) {
      showMessage("اكتب رقم الهاتف وكلمة المرور.", "error");
      return;
    }

    busy = true;
    document.getElementById("loginButton").disabled = true;
    showMessage("جارٍ تسجيل الدخول...");

    try {
      const { data, error } = await sb.auth.signInWithPassword({
        email: phoneToEmail(phone),
        password
      });

      if (error) throw error;

      currentUser = data.user;

      const { data: profile, error: profileError } = await sb
        .from("profiles")
        .select("id, phone, is_admin")
        .eq("id", currentUser.id)
        .maybeSingle();

      if (profileError) {
        throw new Error("تعذرت قراءة ملف الإدارة: " + profileError.message);
      }

      if (!profile || profile.is_admin !== true) {
        await sb.auth.signOut();
        currentUser = null;
        throw new Error("هذا الحساب ليس حساب إدارة مفعّلًا.");
      }

      document.getElementById("loginCard").classList.add("hidden");
      document.getElementById("dashboard").classList.remove("hidden");
      document.getElementById("adminInfo").textContent =
        "تم تسجيل الدخول: " + (profile.phone || phone);

      showMessage("تم تسجيل الدخول بنجاح.", "success");
      await loadRequests();
    } catch (error) {
      showMessage("تعذر تسجيل الدخول: " + error.message, "error");
    } finally {
      busy = false;
      document.getElementById("loginButton").disabled = false;
    }
  }

  async function loadRequests() {
    if (!currentUser) return;

    const body = document.getElementById("requestsBody");
    body.innerHTML = '<tr><td colspan="8">جارٍ تحميل الطلبات...</td></tr>';

    try {
      const { data, error } = await sb
        .from("wallet_requests")
        .select("id,user_id,request_type,amount,method,reference,status,created_at,admin_note")
        .order("created_at", { ascending: false })
        .limit(200);

      if (error) throw error;

      if (!data || data.length === 0) {
        body.innerHTML =
          '<tr><td colspan="8">لا توجد طلبات حتى الآن.</td></tr>';
        showMessage("تم تحديث الطلبات.", "success");
        return;
      }

      body.innerHTML = data.map(function(req) {
        const type = req.request_type === "deposit" ? "إيداع" :
          req.request_type === "withdraw" ? "سحب" : req.request_type;

        const statusClass = req.status === "pending" ? "pending" :
          req.status === "approved" ? "approved" : "rejected";

        const date = req.created_at
          ? new Date(req.created_at).toLocaleString("ar-EG")
          : "—";

        let actions = "—";
        if (req.status === "pending") {
          const id = escapeHtml(req.id);
          actions =
            '<button class="approve" data-id="' + id +
            '" data-decision="approve">موافقة</button>' +
            '<button class="reject" data-id="' + id +
            '" data-decision="reject">رفض</button>';
        }

        return '<tr class="request">' +
          '<td>' + escapeHtml(date) + '</td>' +
          '<td>' + escapeHtml(req.user_id) + '</td>' +
          '<td>' + escapeHtml(type) + '</td>' +
          '<td>' + escapeHtml(money(req.amount)) + '</td>' +
          '<td>' + escapeHtml(req.method || "—") + '</td>' +
          '<td>' + escapeHtml(req.reference || "—") + '</td>' +
          '<td><span class="status ' + statusClass + '">' +
            escapeHtml(statusText(req.status)) + '</span>' +
            (req.admin_note ? '<p class="muted">ملاحظة: ' +
              escapeHtml(req.admin_note) + '</p>' : '') +
          '</td>' +
          '<td>' + actions + '</td>' +
          '</tr>';
      }).join("");

      showMessage("تم تحميل " + data.length + " طلب.", "success");
    } catch (error) {
      body.innerHTML =
        '<tr><td colspan="8">تعذر تحميل الطلبات.</td></tr>';
      showMessage(
        "تعذر قراءة جدول wallet_requests: " + error.message +
        "\nتحقق من سياسات RLS وصلاحيات حساب الإدارة.",
        "error"
      );
    }
  }

  document.getElementById("requestsBody").addEventListener("click", async function(event) {
    const button = event.target.closest("button[data-decision]");
    if (!button) return;

    const id = button.dataset.id;
    const decision = button.dataset.decision;

    if (!id || !["approve", "reject"].includes(decision)) return;

    const confirmation = decision === "approve"
      ? "هل تحققت من الطلب وتريد الموافقة عليه؟"
      : "هل تريد رفض هذا الطلب؟";

    if (!window.confirm(confirmation)) return;

    const note = window.prompt("ملاحظة اختيارية للطلب:") || null;

    button.disabled = true;
    showMessage("جارٍ تنفيذ القرار...");

    try {
      const { error } = await sb.rpc("admin_review_wallet_request", {
        p_request_id: id,
        p_decision: decision,
        p_note: note
      });

      if (error) throw error;

      showMessage(
        decision === "approve"
          ? "تمت الموافقة. إذا كان الطلب صالحًا، تحدّث قاعدة البيانات الرصيد."
          : "تم رفض الطلب.",
        "success"
      );

      await loadRequests();
    } catch (error) {
      showMessage(
        "لم يتم تنفيذ القرار: " + error.message,
        "error"
      );
      button.disabled = false;
    }
  });

  async function signOut() {
    await sb.auth.signOut();
    currentUser = null;
    document.getElementById("dashboard").classList.add("hidden");
    document.getElementById("loginCard").classList.remove("hidden");
    document.getElementById("password").value = "";
    showMessage("تم تسجيل الخروج.");
  }

  async function restoreSession() {
    const { data } = await sb.auth.getSession();
    if (!data.session) return;

    currentUser = data.session.user;

    const { data: profile, error } = await sb
      .from("profiles")
      .select("id, phone, is_admin")
      .eq("id", currentUser.id)
      .maybeSingle();

    if (error || !profile || profile.is_admin !== true) {
      await sb.auth.signOut();
      currentUser = null;
      return;
    }

    document.getElementById("loginCard").classList.add("hidden");
    document.getElementById("dashboard").classList.remove("hidden");
    document.getElementById("adminInfo").textContent =
      "تم تسجيل الدخول: " + (profile.phone || "");
    await loadRequests();
  }

  restoreSession();
</script>
</body>
</html>
