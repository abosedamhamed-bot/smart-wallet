<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة تحكم المدير</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #f4f7ff;
      background: linear-gradient(135deg, #081326, #241047);
      min-height: 100vh;
    }

    header {
      padding: 22px 16px;
      background: #101a32;
      border-bottom: 1px solid #344366;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 23px;
    }

    header p {
      margin: 0;
      color: #aab8d4;
      font-size: 14px;
    }

    main {
      max-width: 950px;
      padding: 18px;
      margin: auto;
    }

    .card {
      background: #121e38;
      border: 1px solid #304363;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 18px;
    }

    input, button {
      width: 100%;
      border-radius: 10px;
      padding: 13px;
      font-size: 15px;
      margin-top: 10px;
    }

    input {
      color: white;
      background: #0a1429;
      border: 1px solid #405477;
    }

    button {
      cursor: pointer;
      border: none;
      font-weight: bold;
    }

    .primary {
      background: #16d9ee;
      color: #071326;
    }

    .approve {
      background: #16c784;
      color: #071326;
    }

    .reject {
      background: #ff5268;
      color: white;
    }

    .secondary {
      background: #34466a;
      color: white;
    }

    .request {
      background: #0b162d;
      border: 1px solid #304363;
      border-radius: 12px;
      padding: 15px;
      margin-top: 12px;
      overflow-wrap: anywhere;
    }

    .request h3 {
      margin-top: 0;
    }

    .muted {
      color: #aab8d4;
      font-size: 14px;
      line-height: 1.8;
    }

    .status {
      color: #16d9ee;
      font-weight: bold;
    }

    #message {
      white-space: pre-wrap;
      line-height: 1.8;
      margin-top: 12px;
    }

    .hidden {
      display: none;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    .actions button {
      flex: 1;
    }

    @media (max-width: 450px) {
      .actions {
        flex-direction: column;
        gap: 0;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>لوحة تحكم المدير</h1>
  <p>إدارة طلبات الإيداع ومراجعة العمليات</p>
</header>

<main>

  <section class="card" id="loginCard">
    <h2>تسجيل دخول المدير</h2>

    <input
      id="email"
      type="email"
      placeholder="البريد الإلكتروني"
      autocomplete="username"
    >

    <input
      id="password"
      type="password"
      placeholder="كلمة المرور"
      autocomplete="current-password"
    >

    <button class="primary" id="loginBtn">تسجيل الدخول</button>

    <p class="muted">
      يجب استخدام حساب المدير المصرّح له.
    </p>
  </section>

  <section class="card hidden" id="dashboard">
    <h2>طلبات الإيداع</h2>

    <p id="adminInfo" class="muted"></p>

    <button class="primary" id="refreshBtn">
      تحديث الطلبات
    </button>

    <button class="secondary" id="logoutBtn">
      تسجيل الخروج
    </button>

    <div id="message" role="status"></div>
    <div id="requests"></div>
  </section>

</main>

<script type="module">
  import { initializeApp } from
    "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  } from
    "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

  import {
    getDatabase,
    ref,
    get
  } from
    "https://www.gstatic.com/firebasejs/11.10.0/firebase-database.js";

  import {
    getFunctions,
    httpsCallable
  } from
    "https://www.gstatic.com/firebasejs/11.10.0/firebase-functions.js";

  // استبدل القيم التالية بإعدادات مشروع Firebase الخاص بك.
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    databaseURL:
      "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
    projectId: "YOUR_PROJECT",
    appId: "YOUR_APP_ID"
  };

  // ضع UID الحقيقي لحساب المدير.
  const ADMIN_UID = "PUT_ADMIN_UID_HERE";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  // غيّر المنطقة إذا نشرت الدالة في منطقة أخرى.
  const functions = getFunctions(app, "europe-west1");
  const reviewDeposit = httpsCallable(functions, "reviewDeposit");

  const $ = id => document.getElementById(id);

  let busy = false;

  function showMessage(text, error = false) {
    $("message").textContent = text;
    $("message").style.color = error ? "#ff7888" : "#16d9ee";
  }

  function money(value) {
    const amount = Number(value);

    if (!Number.isFinite(amount)) {
      return "غير محدد";
    }

    return amount.toLocaleString("ar-EG", {
      maximumFractionDigits: 2
    }) + " ج.م";
  }

  function safeText(value) {
    return String(value ?? "");
  }

  $("loginBtn").addEventListener("click", async () => {
    const email = $("email").value.trim();
    const password = $("password").value;

    if (!email || !password) {
      alert("اكتب البريد الإلكتروني وكلمة المرور.");
      return;
    }

    $("loginBtn").disabled = true;

    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (error) {
      alert("تعذر تسجيل الدخول. راجع بيانات الحساب وإعدادات Firebase.");
    } finally {
      $("loginBtn").disabled = false;
    }
  });

  onAuthStateChanged(auth, async user => {
    const isAdmin = Boolean(user && user.uid === ADMIN_UID);

    $("loginCard").classList.toggle("hidden", isAdmin);
    $("dashboard").classList.toggle("hidden", !isAdmin);

    if (!user) {
      showMessage("");
      return;
    }

    if (!isAdmin) {
      showMessage("هذا الحساب ليس لديه صلاحية المدير.", true);

      try {
        await signOut(auth);
      } catch (_) {}

      return;
    }

    $("adminInfo").textContent =
      "تم تسجيل الدخول بحساب المدير: " + user.email;

    await loadRequests();
  });

  async function loadRequests() {
    if (!auth.currentUser ||
        auth.currentUser.uid !== ADMIN_UID) {
      return;
    }

    const container = $("requests");
    container.replaceChildren();

    showMessage("جارٍ تحميل الطلبات...");

    try {
      const snapshot = await get(ref(db, "requests"));

      if (!snapshot.exists()) {
        showMessage("لا توجد طلبات إيداع.");
        return;
      }

      let count = 0;

      snapshot.forEach(userSnapshot => {
        const uid = userSnapshot.key;

        userSnapshot.forEach(requestSnapshot => {
          const requestId = requestSnapshot.key;
          const item = requestSnapshot.val();

          if (!item || item.type !== "deposit") {
            return;
          }

          count++;

          const card = document.createElement("article");
          card.className = "request";

          const title = document.createElement("h3");
          title.textContent = "طلب إيداع";

          const details = document.createElement("p");
          details.className = "muted";
          details.textContent =
            "رقم المستخدم: " + uid +
            "\nرقم الطلب: " + requestId +
            "\nالمبلغ: " + money(item.amount) +
            "\nالحالة: " + safeText(item.status);

          card.append(title, details);

          if (item.status === "pending") {
            const actions = document.createElement("div");
            actions.className = "actions";

            const approve = document.createElement("button");
            approve.className = "approve";
            approve.textContent = "موافقة وإضافة الرصيد";

            approve.addEventListener("click", () => {
              review(uid, requestId, "approved", approve, reject);
            });

            const reject = document.createElement("button");
            reject.className = "reject";
            reject.textContent = "رفض الطلب";

            reject.addEventListener("click", () => {
              review(uid, requestId, "rejected", approve, reject);
            });

            actions.append(approve, reject);
            card.append(actions);
          } else {
            const status = document.createElement("p");
            status.className = "status";
            status.textContent = "تمت مراجعة الطلب.";
            card.append(status);
          }

          container.append(card);
        });
      });

      showMessage(
        count ? "عدد طلبات الإيداع: " + count : "لا توجد طلبات إيداع."
      );

    } catch (error) {
      showMessage(
        "تعذر تحميل الطلبات. تحقق من اتصال Firebase وقواعد القراءة.",
        true
      );
    }
  }

  async function review(uid, requestId, action, approve, reject) {
    if (busy) return;

    if (!auth.currentUser ||
        auth.currentUser.uid !== ADMIN_UID) {
      showMessage("ليس لديك صلاحية تنفيذ هذه العملية.", true);
      return;
    }

    const promptText = action === "approved"
      ? "هل تريد الموافقة على الطلب وإضافة المبلغ إلى رصيد المستخدم؟"
      : "هل تريد رفض طلب الإيداع؟";

    if (!confirm(promptText)) return;

    busy = true;
    approve.disabled = true;
    reject.disabled = true;

    showMessage("جارٍ معالجة الطلب...");

    try {
      const result = await reviewDeposit({
        uid,
        requestId,
        action
      });

      showMessage(
        result.data?.message || "تمت معالجة الطلب."
      );

      await loadRequests();

    } catch (error) {
      showMessage(
        "تعذر تنفيذ العملية: " +
        (error.message || "خطأ غير معروف") +
        "\nحدّث الطلب وتحقق من حالة الرصيد قبل إعادة المحاولة.",
        true
      );

      approve.disabled = false;
      reject.disabled = false;

    } finally {
      busy = false;
    }
  }

  $("refreshBtn").addEventListener("click", loadRequests);

  $("logoutBtn").addEventListener("click", async () => {
    await signOut(auth);
  });
</script>

</body>
</html>
