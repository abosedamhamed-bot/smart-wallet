<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Wallet | الإدارة</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px;
      font-family: Arial, sans-serif;
      background: #f4f0ff;
      color: #241641;
    }

    .container {
      max-width: 650px;
      margin: 25px auto;
      padding: 22px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 5px 25px #0001;
    }

    h1 {
      color: #7138d8;
      text-align: center;
    }

    input, button {
      display: block;
      width: 100%;
      padding: 13px;
      margin: 10px 0;
      border-radius: 9px;
      font-size: 16px;
    }

    input {
      border: 1px solid #ddd;
    }

    button {
      border: none;
      background: #7138d8;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    .card {
      border: 1px solid #e5dcf8;
      border-radius: 12px;
      padding: 14px;
      margin: 12px 0;
      overflow-wrap: anywhere;
    }

    .secondary {
      background: #eee;
      color: #241641;
    }

    #dashboard {
      display: none;
    }

    #message {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.7;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Smart Wallet</h1>
    <h3>لوحة الإدارة</h3>

    <section id="login">
      <p>اكتب كلمة سر الإدارة.</p>

      <input
        id="adminPassword"
        type="password"
        placeholder="كلمة سر الإدارة"
        autocomplete="current-password"
      >

      <button id="loginButton">دخول</button>
    </section>

    <section id="dashboard">
      <h3>إدارة الطلبات</h3>
      <button id="refreshButton">عرض الطلبات</button>

      <h3>تعديل رصيد مستخدم</h3>

      <input
        id="phone"
        type="tel"
        placeholder="رقم موبايل المستخدم"
      >

      <input
        id="balance"
        type="number"
        min="0"
        step="0.01"
        placeholder="الرصيد الجديد بالجنيه"
      >

      <button id="saveBalanceButton">حفظ الرصيد</button>

      <div id="requests"></div>

      <button class="secondary" id="logoutButton">
        تسجيل الخروج
      </button>
    </section>

    <p id="message" role="status"></p>
  </main>

<script>
"use strict";

// بيانات مشروع Supabase
const API_URL =
  "https://sjhjxbnhhwftwlkshpql.supabase.co/functions/v1/smart-service";

// مفتاح anon عام، وليس مفتاح service_role
const PUBLIC_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNqaGp4Ym5oaHdmdHdsa3NocHFsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIzNDY4MDYsImV4cCI6MjEwNzkyMjgwNn0.HhbEFdDqN5IlvjWA5s2B72oj_-pmxDQnLneu8W5OwvA";

let adminPassword = "";

const $ = id => document.getElementById(id);

function showMessage(text) {
  $("message").textContent = text;
}

async function callApi(actionData) {
  const response = await fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "apikey": PUBLIC_KEY,
      "Authorization": "Bearer " + PUBLIC_KEY,
      "x-admin-password": adminPassword
    },
    body: JSON.stringify(actionData)
  });

  const raw = await response.text();

  let result;

  try {
    result = JSON.parse(raw);
  } catch {
    throw new Error(
      "استجابة غير مفهومة من الخادم. رمز HTTP: " + response.status
    );
  }

  if (!response.ok) {
    throw new Error(
      (result.error || result.message || "فشل الطلب") +
      " (HTTP " + response.status + ")"
    );
  }

  return result;
}

$("loginButton").addEventListener("click", async () => {
  const button = $("loginButton");
  adminPassword = $("adminPassword").value;

  if (!adminPassword) {
    showMessage("اكتب كلمة سر الإدارة أولاً.");
    return;
  }

  button.disabled = true;
  showMessage("جارٍ التحقق من الاتصال...");

  try {
    await callApi({ action: "list_requests" });

    $("login").style.display = "none";
    $("dashboard").style.display = "block";
    $("adminPassword").value = "";

    showMessage("تم الاتصال بلوحة الإدارة.");
    await loadRequests();

  } catch (error) {
    adminPassword = "";
    showMessage("تعذر الدخول:\n" + error.message);
  } finally {
    button.disabled = false;
  }
});

async function loadRequests() {
  showMessage("جارٍ تحميل الطلبات...");

  try {
    const result = await callApi({
      action: "list_requests"
    });

    const container = $("requests");
    container.replaceChildren();

    const title = document.createElement("h3");
    title.textContent = "طلبات الإيداع والسحب";
    container.appendChild(title);

    const requests = result.requests || [];

    if (requests.length === 0) {
      const empty = document.createElement("p");
      empty.textContent = "لا توجد طلبات حالياً.";
      container.appendChild(empty);
    }

    requests.forEach(request => {
      const card = document.createElement("div");
      card.className = "card";

      const details = document.createElement("p");

      details.textContent =
        "رقم الطلب: " + request.id +
        "\nرقم الموبايل: " + (request.phone_number || "غير محدد") +
        "\nالنوع: " + (request.request_type || "غير محدد") +
        "\nالمبلغ: " + (request.amount ?? 0) + " جنيه" +
        "\nطريقة الدفع: " + (request.payment_method || "غير محددة") +
        "\nالحالة: " + (request.status || "غير محددة");

      card.appendChild(details);

      if (request.status === "pending") {
        const approve = document.createElement("button");
        approve.textContent = "قبول الطلب";

        approve.onclick = () =>
          updateRequest(request.id, "approved");

        const reject = document.createElement("button");
        reject.textContent = "رفض الطلب";
        reject.className = "secondary";

        reject.onclick = () =>
          updateRequest(request.id, "rejected");

        card.append(approve, reject);
      }

      container.appendChild(card);
    });

    showMessage("تم تحميل " + requests.length + " طلب.");

  } catch (error) {
    showMessage("تعذر تحميل الطلبات:\n" + error.message);
  }
}

async function updateRequest(id, status) {
  if (!confirm("هل تريد تغيير حالة هذا الطلب؟")) return;

  try {
    await callApi({
      action: "update_request",
      id: id,
      status: status
    });

    showMessage("تم تحديث حالة الطلب.");
    await loadRequests();

  } catch (error) {
    showMessage("تعذر تحديث الطلب:\n" + error.message);
  }
}

$("refreshButton").addEventListener("click", loadRequests);

$("saveBalanceButton").addEventListener("click", async () => {
  const phone = $("phone").value.trim();
  const balanceText = $("balance").value;

  if (!phone || balanceText === "") {
    showMessage("اكتب رقم الموبايل والرصيد.");
    return;
  }

  const balance = Number(balanceText);

  if (!Number.isFinite(balance) || balance < 0) {
    showMessage("قيمة الرصيد غير صحيحة.");
    return;
  }

  if (!confirm("هل تريد حفظ الرصيد الجديد؟")) return;

  try {
    await callApi({
      action: "set_balance",
      phone_number: phone,
      balance: balance
    });

    showMessage("تم حفظ الرصيد بنجاح.");

  } catch (error) {
    showMessage("تعذر حفظ الرصيد:\n" + error.message);
  }
});

$("logoutButton").addEventListener("click", () => {
  adminPassword = "";

  $("dashboard").style.display = "none";
  $("login").style.display = "block";
  $("requests").replaceChildren();

  showMessage("تم تسجيل الخروج.");
});
</script>
</body>
</html>
