<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10142e">
<title>منصتي PRO</title>

<style>
:root{
 --bg:#0b1024;
 --card:#171d3b;
 --card2:#20274a;
 --cyan:#22d3ee;
 --purple:#8b5cf6;
 --text:#f4f6ff;
 --muted:#a6aecb;
 --green:#4ade80;
 --red:#fb7185;
 --border:rgba(255,255,255,.09)
}
*{box-sizing:border-box}
body{
 margin:0;color:var(--text);
 font-family:Tahoma,Arial,sans-serif;
 background:radial-gradient(ellipse at top,#27205b,#10142e 45%,#080d1e);
 min-height:100vh
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.container{max-width:1100px;margin:auto;padding:15px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:15px 0}
.logo{font-size:23px;font-weight:bold}
.logo span{color:var(--cyan)}
.card{
 background:linear-gradient(145deg,rgba(31,39,77,.97),rgba(20,25,53,.97));
 border:1px solid var(--border);border-radius:20px;
 padding:18px;margin-bottom:15px
}
h1{font-size:25px}
h2{font-size:19px}
p{line-height:1.8}
.muted{color:var(--muted);font-size:13px}
.btn{
 border:0;border-radius:12px;padding:12px 16px;
 background:linear-gradient(110deg,var(--cyan),#67e8f9);
 color:#071322;font-weight:bold
}
.btn.secondary{background:#292f56;color:white;border:1px solid var(--border)}
.btn.purple{background:linear-gradient(110deg,#7c3aed,#a78bfa);color:white}
.btn.danger{background:#7f1d35;color:white}
.btn.small{padding:8px 11px;font-size:12px}
input,textarea,select{
 width:100%;padding:13px;margin:7px 0 14px;
 color:white;background:#0d1430;border:1px solid #343d68;
 border-radius:11px;outline:none
}
input:focus,textarea:focus,select:focus{border-color:var(--cyan)}
label{font-size:13px;color:#dce4ff}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat{padding:15px;border-radius:16px;background:#111832;border:1px solid var(--border)}
.stat .value{font-size:21px;font-weight:bold;color:var(--cyan);margin:8px 0}
.stat .label{font-size:12px;color:var(--muted)}
.hero{
 background:linear-gradient(125deg,#31216c,#172b5a 65%,#12364b);
 border:1px solid #4a4382;border-radius:23px;padding:23px;margin-bottom:16px
}
.balance{font-size:29px;font-weight:bold;margin:12px 0}
.badge,.tag{
 display:inline-block;border-radius:25px;padding:7px 10px;
 background:#252b4e;color:#c6f7ff;font-size:12px
}
.tag.green{background:#123e35;color:#86efac}
.tag.red{background:#4b1f31;color:#fda4af}
.tag.yellow{background:#493a1b;color:#fde68a}
.list-item{padding:14px 0;border-bottom:1px solid var(--border)}
.list-item:last-child{border-bottom:0}
.notice{padding:12px;border-radius:12px;background:#302746;border:1px solid #5b477e;font-size:12px;line-height:1.9;margin-bottom:15px}
.error{color:var(--red)}
.success{color:var(--green)}
.empty{text-align:center;padding:25px 10px;color:var(--muted)}
.auth-wrap{max-width:440px;margin:5vh auto;padding:15px}
.auth-logo{text-align:center;margin:25px 0}
.auth-logo .logo{font-size:32px}
.auth-tabs{display:flex;gap:8px;margin-bottom:18px}
.auth-tabs button{flex:1}
.page{padding-bottom:100px}
.bottom-nav{
 position:fixed;bottom:0;left:0;right:0;z-index:10;
 display:flex;justify-content:space-around;gap:2px;
 padding:9px 3px calc(9px + env(safe-area-inset-bottom));
 background:rgba(9,14,33,.97);border-top:1px solid var(--border);
 backdrop-filter:blur(15px)
}
.nav-btn{flex:1;max-width:110px;background:none;border:0;color:#929bbd;font-size:10px;padding:6px 2px;border-radius:10px}
.nav-btn .icon{display:block;font-size:20px;margin-bottom:5px}
.nav-btn.active{color:var(--cyan);background:#192343}
hr{border:0;border-top:1px solid var(--border);margin:18px 0}
footer{text-align:center;color:var(--muted);font-size:11px;padding:15px}
@media(min-width:700px){
 .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
}
</style>
</head>

<body>

<section id="authScreen" class="auth-wrap">
 <div class="auth-logo">
  <div class="logo">منصتي <span>PRO</span></div>
  <p class="muted">منصتك لإدارة المهام والعمولات</p>
 </div>

 <div class="card">
  <div class="auth-tabs">
   <button id="loginTab" class="btn" onclick="setAuthMode('login')">تسجيل الدخول</button>
   <button id="registerTab" class="btn secondary" onclick="setAuthMode('register')">إنشاء حساب</button>
  </div>

  <form id="authForm">
   <div id="nameWrap" class="hidden">
    <label>الاسم</label>
    <input id="fullName" maxlength="80" placeholder="اكتب اسمك">
   </div>

   <label>البريد الإلكتروني</label>
   <input id="email" type="email" autocomplete="email" required placeholder="name@example.com">

   <label>كلمة المرور</label>
   <input id="password" type="password" autocomplete="current-password" minlength="6" required placeholder="6 أحرف على الأقل">

   <p id="authMessage" class="muted" role="status"></p>
   <button id="authSubmit" class="btn" type="submit" style="width:100%">تسجيل الدخول</button>
   <button type="button" class="btn secondary" style="width:100%;margin-top:10px" onclick="resetPassword()">نسيت كلمة المرور؟</button>
  </form>
 </div>
</section>

<section id="appScreen" class="hidden">
 <div class="container">
  <header class="topbar">
   <div class="logo">منصتي <span>PRO</span></div>
   <div class="row">
    <span class="badge" id="userBadge">مستخدم</span>
    <button class="btn secondary small" onclick="logout()">خروج</button>
   </div>
  </header>

  <div id="globalMessage" class="notice hidden"></div>
  <main id="pageContent" class="page"></main>
  <footer>منصتي PRO</footer>
 </div>

 <nav class="bottom-nav">
  <button class="nav-btn active" data-page="home" onclick="navigate('home')"><span class="icon">⌂</span>الرئيسية</button>
  <button class="nav-btn" data-page="tasks" onclick="navigate('tasks')"><span class="icon">✓</span>المهام</button>
  <button class="nav-btn" data-page="wallet" onclick="navigate('wallet')"><span class="icon">▣</span>المحفظة</button>
  <button class="nav-btn" data-page="vip" onclick="navigate('vip')"><span class="icon">♛</span>VIP</button>
  <button class="nav-btn" data-page="profile" onclick="navigate('profile')"><span class="icon">♙</span>حسابي</button>
  <button class="nav-btn" data-page="more" onclick="navigate('more')"><span class="icon">☰</span>المزيد</button>
 </nav>
</section>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<script>
/* إعدادات مشروع Firebase الحالي */
const firebaseConfig = {
 apiKey: "AIzaSyA8q6z4McET3_d208PtSnFGEjlAVUezJ8k",
 authDomain: "mansatipro.firebaseapp.com",
 databaseURL: "https://mansatipro-default-rtdb.europe-west1.firebasedatabase.app",
 projectId: "mansatipro",
 storageBucket: "mansatipro.firebasestorage.app",
 messagingSenderId: "114519438941",
 appId: "1:114519438941:web:8b92991a652bb24150ffb4",
 measurementId: "G-TMZBN1L9KV"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();

let currentUser = null;
let isAdmin = false;
let authMode = "login";
let currentPage = "home";
let tasks = {};
let ownProfile = {};
let ownBalance = 0;
let ownRequests = {};
let ownCompletions = {};
let allUsers = {};
let allRequests = {};
let allCompletions = {};
let listeners = [];

function esc(v){
 return String(v ?? "").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

function money(v){
 return Number(v||0).toLocaleString("ar-EG",{
  minimumFractionDigits:2,maximumFractionDigits:2
 })+" ج.م";
}

function showMessage(text,error=false){
 const el=document.getElementById("globalMessage");
 el.textContent=text;
 el.classList.remove("hidden");
 el.className=error?"notice error":"notice success";
}
function clearMessage(){
 document.getElementById("globalMessage").classList.add("hidden");
}

function setAuthMode(mode){
 authMode=mode;
 document.getElementById("nameWrap").classList.toggle("hidden",mode!=="register");
 document.getElementById("loginTab").className=mode==="login"?"btn":"btn secondary";
 document.getElementById("registerTab").className=mode==="register"?"btn":"btn secondary";
 document.getElementById("authSubmit").textContent=mode==="login"?"تسجيل الدخول":"إنشاء حساب";
 document.getElementById("authMessage").textContent="";
}
setAuthMode("login");

document.getElementById("authForm").addEventListener("submit",async e=>{
 e.preventDefault();

 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 const name=document.getElementById("fullName").value.trim();
 const btn=document.getElementById("authSubmit");

 btn.disabled=true;
 btn.textContent="جارٍ التنفيذ...";
 const msg=document.getElementById("authMessage");
 msg.textContent="";

 try{
  if(authMode==="register"){
   if(!name)throw new Error("اكتب اسمك أولاً.");
   const cred=await auth.createUserWithEmailAndPassword(email,password);
   await cred.user.updateProfile({displayName:name});
   await db.ref("profiles/"+cred.user.uid).set({
    name:name,
    email:email,
    createdAt:Date.now()
   });
  }else{
   await auth.signInWithEmailAndPassword(email,password);
  }
 }catch(error){
  const errors={
   "auth/email-already-in-use":"هذا البريد مسجل بالفعل.",
   "auth/invalid-email":"صيغة البريد الإلكتروني غير صحيحة.",
   "auth/weak-password":"كلمة المرور يجب أن تكون 6 أحرف على الأقل.",
   "auth/user-not-found":"الحساب غير موجود.",
   "auth/wrong-password":"كلمة المرور غير صحيحة.",
   "auth/invalid-credential":"البريد أو كلمة المرور غير صحيحة.",
   "auth/operation-not-allowed":"فعّل Email/Password في Firebase Authentication.",
   "auth/network-request-failed":"تعذر الاتصال بالإنترنت."
  };
  msg.textContent=errors[error.code]||error.message||"تعذر إتمام العملية.";
  msg.className="error";
 }finally{
  btn.disabled=false;
  btn.textContent=authMode==="login"?"تسجيل الدخول":"إنشاء حساب";
 }
});

async function resetPassword(){
 const email=document.getElementById("email").value.trim();
 if(!email){
  document.getElementById("authMessage").textContent="اكتب بريدك الإلكتروني أولاً.";
  return;
 }
 try{
  await auth.sendPasswordResetEmail(email);
  document.getElementById("authMessage").textContent="إذا كان البريد مسجلاً، فسيصلك رابط استعادة كلمة المرور.";
 }catch(e){
  document.getElementById("authMessage").textContent="تعذر إرسال الرابط. تحقق من إعدادات Firebase.";
 }
}

async function logout(){
 try{await auth.signOut();}
 catch(e){showMessage("تعذر تسجيل الخروج.",true);}
}

function clearListeners(){
 listeners.forEach(x=>x.ref.off("value",x.callback));
 listeners=[];
}
function listen(ref,callback){
 ref.on("value",callback);
 listeners.push({ref,callback});
}

function startDataListeners(){
 clearListeners();
 if(!currentUser)return;

 const uid=currentUser.uid;

 listen(db.ref("adminUids/"+uid),snap=>{
  isAdmin=snap.val()===true;
  updateNav();
  renderPage();
  if(isAdmin)startAdminListeners();
 });

 listen(db.ref("profiles/"+uid),snap=>{
  ownProfile=snap.val()||{};
  renderPage();
 });

 listen(db.ref("balances/"+uid),snap=>{
  ownBalance=Number(snap.val()||0);
  renderPage();
 });

 listen(db.ref("tasks"),snap=>{
  tasks=snap.val()||{};
  renderPage();
 });

 listen(db.ref("requests/"+uid),snap=>{
  ownRequests=snap.val()||{};
  renderPage();
 });

 listen(db.ref("taskCompletions/"+uid),snap=>{
  ownCompletions=snap.val()||{};
  renderPage();
 });
}

let adminListenersStarted=false;
function startAdminListeners(){
 if(!isAdmin||adminListenersStarted)return;
 adminListenersStarted=true;

 listen(db.ref("profiles"),snap=>{
  allUsers=snap.val()||{};
  renderPage();
 });

 listen(db.ref("requests"),snap=>{
  allRequests=snap.val()||{};
  renderPage();
 });

 listen(db.ref("taskCompletions"),snap=>{
  allCompletions=snap.val()||{};
  renderPage();
 });
}

auth.onAuthStateChanged(async user=>{
 clearListeners();
 currentUser=user;
 isAdmin=false;
 adminListenersStarted=false;

 document.getElementById("authScreen").classList.toggle("hidden",!!user);
 document.getElementById("appScreen").classList.toggle("hidden",!user);

 if(!user)return;

 document.getElementById("userBadge").textContent=user.displayName||user.email||"مستخدم";

 try{
  const profileRef=db.ref("profiles/"+user.uid);
  const profileSnap=await profileRef.once("value");

  if(!profileSnap.exists()){
   await profileRef.set({
    name:user.displayName||"",
    email:user.email||"",
    createdAt:Date.now()
   });
  }

  startDataListeners();
  navigate("home");
 }catch(error){
  showMessage("تعذر تحميل بيانات الحساب. تأكد من إعداد قواعد Firebase.",true);
 }
});

function updateNav(){
 const nav=document.querySelector('.nav-btn[data-page="more"]');
 if(nav)nav.title=isAdmin?"المزيد ولوحة الإدارة":"المزيد";
}

function navigate(page){
 currentPage=page;
 document.querySelectorAll(".nav-btn").forEach(btn=>{
  btn.classList.toggle("active",btn.dataset.page===page);
 });
 renderPage();
 window.scrollTo({top:0,behavior:"smooth"});
}

function renderPage(){
 const el=document.getElementById("pageContent");
 if(!el||!currentUser)return;

 const pages={
  home:renderHome,
  tasks:renderTasks,
  wallet:renderWallet,
  vip:renderVIP,
  profile:renderProfile,
  more:renderMore,
  history:renderHistory,
  deposit:()=>renderRequestForm("deposit"),
  withdraw:()=>renderRequestForm("withdraw"),
  support:renderSupport,
  payments:renderPayments,
  admin:renderAdmin
 };

 el.innerHTML=(pages[currentPage]||renderHome)();
}

function renderHome(){
 const available=Object.values(tasks).filter(t=>t&&t.enabled!==false).length;
 const completed=Object.keys(ownCompletions).length;
 return `
 <section class="hero">
  <div class="muted">أهلاً بك في منصتي PRO</div>
  <h1>مرحباً ${esc(currentUser.displayName||ownProfile.name||"بك")} 👋</h1>
  <div class="muted">رصيد الحساب</div>
  <div class="balance">${money(ownBalance)}</div>
  <button class="btn" onclick="navigate('tasks')">استعرض المهام</button>
  <button class="btn secondary" onclick="navigate('wallet')">المحفظة</button>
 </section>

 <div class="grid">
  <div class="stat"><div class="label">رصيد الحساب</div><div class="value">${money(ownBalance)}</div></div>
  <div class="stat"><div class="label">المهام المكتملة</div><div class="value">${completed}</div></div>
  <div class="stat"><div class="label">المهام المتاحة</div><div class="value">${available}</div></div>
  <div class="stat"><div class="label">حالة الحساب</div><div class="value" style="font-size:16px">نشط</div></div>
 </div>

 <div class="card">
  <h2>ابدأ من هنا</h2>
  <div class="list-item row"><div><b>المهام والعمولات</b><p class="muted">عرض المهام المتاحة.</p></div><button class="btn small" onclick="navigate('tasks')">فتح</button></div>
  <div class="list-item row"><div><b>المحفظة</b><p class="muted">عرض الرصيد والطلبات.</p></div><button class="btn small" onclick="navigate('wallet')">فتح</button></div>
  <div class="list-item row"><div><b>خدمة الدعم</b><p class="muted">إرسال رسالة للدعم.</p></div><button class="btn small" onclick="navigate('support')">فتح</button></div>
 </div>`;
}

function renderTasks(){
 const list=Object.entries(tasks).filter(([id,t])=>t&&t.enabled!==false);
 if(!list.length)return `<h1>المهام</h1><div class="card empty">لا توجد مهام متاحة حاليًا.</div>`;

 return `<h1>المهام والطلبات</h1>
 <div class="card">
 ${list.map(([id,t])=>{
  const done=!!ownCompletions[id];
  return `<div class="list-item">
   <div class="row"><h3>${esc(t.title)}</h3><span class="tag">${money(t.reward||0)}</span></div>
   <p class="muted">${esc(t.description||"")}</p>
   ${done?'<span class="tag yellow">تم إرسال الإتمام للمراجعة</span>':
    `<button class="btn" onclick="completeTask('${esc(id)}')">إتمام المهمة</button>`}
  </div>`;
 }).join("")}
 </div>`;
}

async function completeTask(id){
 if(ownCompletions[id])return alert("سبق إرسال إتمام هذه المهمة.");
 const task=tasks[id];
 if(!task||task.enabled===false)return alert("المهمة غير متاحة.");

 try{
  await db.ref("taskCompletions/"+currentUser.uid+"/"+id).set({
   taskId:id,
   title:String(task.title||""),
   reward:Number(task.reward||0),
   status:"pending",
   createdAt:Date.now()
  });
  alert("تم إرسال المهمة للمراجعة. تُضاف المكافأة بعد اعتمادها من الإدارة.");
 }catch(e){
  alert("تعذر إرسال المهمة. تحقق من قواعد قاعدة البيانات.");
 }
}

function renderWallet(){
 return `<h1>المحفظة</h1>
 <div class="hero">
  <div class="muted">رصيد الحساب</div>
  <div class="balance">${money(ownBalance)}</div>
 </div>
 <div class="grid">
  <button class="btn" onclick="navigate('deposit')">طلب إيداع</button>
  <button class="btn purple" onclick="navigate('withdraw')">طلب سحب</button>
  <button class="btn secondary" onclick="navigate('history')">سجل المعاملات</button>
  <button class="btn secondary" onclick="navigate('payments')">طريقة الدفع</button>
 </div>
 <div class="card">
  <h2>معلومات مهمة</h2>
  <p class="muted">تُسجل الطلبات في قاعدة البيانات المشتركة. إرسال الطلب لا يعني إتمام تحويل مالي؛ يلزم مراجعة الإدارة وتنفيذ التحويل بالطريقة المعتمدة.</p>
  <p class="muted">لا تدخل كلمة مرور البنك أو الرقم السري للبطاقة أو رموز التحقق في هذا الموقع.</p>
 </div>`;
}

function renderVIP(){
 return `<h1>مستويات VIP</h1>
 <div class="card">
  <div class="row"><h2>المستوى المجاني</h2><span class="tag green">متاح</span></div>
  <p class="muted">المستوى الحالي.</p>
 </div>
 <div class="card">
  <div class="row"><h2>VIP 1</h2><span class="tag">غير مفعّل</span></div>
  <p class="muted">يُفعّل بعد إعداد شروط العضوية من الإدارة.</p>
 </div>
 <div class="card">
  <div class="row"><h2>VIP 2</h2><span class="tag">غير مفعّل</span></div>
  <p class="muted">يُفعّل بعد إعداد شروط العضوية من الإدارة.</p>
 </div>`;
}

function renderProfile(){
 return `<h1>الملف الشخصي</h1>
 <div class="card">
  <div style="text-align:center;font-size:44px">👤</div>
  <h2 style="text-align:center">${esc(currentUser.displayName||ownProfile.name||"المستخدم")}</h2>
  <p class="muted" style="text-align:center;direction:ltr">${esc(currentUser.email||"")}</p>
  <hr>
  <label>الاسم</label>
  <input id="profileName" maxlength="80" value="${esc(ownProfile.name||currentUser.displayName||"")}">
  <button class="btn" onclick="saveProfile()">حفظ الاسم</button>
  <hr>
  <label>معرّف الحساب</label>
  <input readonly value="${esc(currentUser.uid)}">
  <button class="btn secondary" onclick="resetPassword()">إرسال رابط استعادة كلمة المرور</button>
 </div>`;
}

async function saveProfile(){
 const name=document.getElementById("profileName").value.trim();
 if(!name)return alert("اكتب الاسم.");
 try{
  await db.ref("profiles/"+currentUser.uid+"/name").set(name);
  await currentUser.updateProfile({displayName:name});
  document.getElementById("userBadge").textContent=name;
  alert("تم حفظ الاسم.");
 }catch(e){alert("تعذر حفظ الاسم. تحقق من قواعد Firebase.");}
}

function renderMore(){
 return `<h1>المزيد</h1>
 <div class="card">
  ${[
   ["history","📜","سجل المعاملات"],
   ["deposit","➕","طلب إيداع"],
   ["withdraw","➖","طلب سحب"],
   ["payments","💳","طريقة الدفع"],
   ["support","💬","خدمة الدعم"]
  ].map(x=>`<div class="list-item row"><b>${x[1]} ${x[2]}</b><button class="btn secondary small" onclick="navigate('${x[0]}')">فتح</button></div>`).join("")}
  ${isAdmin?`<hr><div class="list-item row"><b>⚙️ لوحة الإدارة</b><button class="btn purple" onclick="navigate('admin')">فتح الإدارة</button></div>`:""}
 </div>`;
}

function renderRequestForm(type){
 const deposit=type==="deposit";
 return `<h1>${deposit?"طلب إيداع":"طلب سحب"}</h1>
 <div class="card">
  <p class="muted">سيُحفظ الطلب في قاعدة البيانات المشتركة ليتمكن المدير من مراجعته.</p>
  <form onsubmit="submitRequest(event,'${type}')">
   <label>المبلغ بالجنيه المصري</label>
   <input id="reqAmount" type="number" min="1" max="1000000" step="0.01" required>
   <label>طريقة الدفع</label>
   <select id="reqMethod" required>
    <option value="">اختر الطريقة</option>
    <option>محفظة إلكترونية</option>
    <option>تحويل بنكي</option>
    <option>طريقة أخرى</option>
   </select>
   <label>ملاحظات (اختياري)</label>
   <textarea id="reqNotes" maxlength="300" rows="3"></textarea>
   <button class="btn" type="submit">إرسال الطلب</button>
  </form>
 </div>`;
}

async function submitRequest(event,type){
 event.preventDefault();
 const amount=Number(document.getElementById("reqAmount").value);
 const method=document.getElementById("reqMethod").value;
 const notes=document.getElementById("reqNotes").value.trim();

 if(!Number.isFinite(amount)||amount<=0)return alert("أدخل مبلغًا صحيحًا.");
 if(type==="withdraw"&&amount>ownBalance)return alert("المبلغ أكبر من رصيد حسابك.");

 try{
  const ref=db.ref("requests/"+currentUser.uid).push();
  await ref.set({
   id:ref.key,
   uid:currentUser.uid,
   type:type,
   amount:amount,
   method:method,
   notes:notes,
   status:"pending",
   createdAt:Date.now()
  });
  alert("تم إرسال الطلب بنجاح.");
  navigate("history");
 }catch(e){
  alert("تعذر إرسال الطلب. تأكد من إعداد قواعد قاعدة البيانات.");
 }
}

function renderHistory(){
 const requests=Object.values(ownRequests||{}).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
 const completions=Object.values(ownCompletions||{});
 return `<h1>سجل المعاملات</h1>
 <div class="card">
  <h2>طلبات المحفظة</h2>
  ${requests.length?requests.map(r=>`<div class="list-item">
   <div class="row"><b>${r.type==="deposit"?"إيداع":"سحب"}</b><span class="tag">${money(r.amount)}</span></div>
   <p class="muted">${esc(r.method||"")} • ${r.createdAt?new Date(r.createdAt).toLocaleString("ar-EG"):""}</p>
   <span class="tag ${r.status==="approved"?"green":r.status==="rejected"?"red":"yellow"}">${esc(statusText(r.status))}</span>
  </div>`).join(""):'<div class="empty">لا توجد طلبات حتى الآن.</div>'}
 </div>
 <div class="card">
  <h2>المهام المكتملة</h2>
  ${completions.length?completions.map(t=>`<div class="list-item"><b>${esc(t.title||"مهمة")}</b><p class="muted">المكافأة: ${money(t.reward||0)}</p><span class="tag yellow">${esc(statusText(t.status))}</span></div>`).join(""):'<div class="empty">لم تُرسل مهام مكتملة بعد.</div>'}
 </div>`;
}

function statusText(status){
 return ({
  pending:"قيد المراجعة",
  approved:"تمت الموافقة",
  rejected:"مرفوض",
  completed:"مكتمل"
 })[status]||"قيد المراجعة";
}

function renderSupport(){
 return `<h1>خدمة الدعم</h1>
 <div class="card">
  <form onsubmit="sendSupport(event)">
   <label>موضوع الرسالة</label>
   <input id="supportSubject" maxlength="100" required>
   <label>تفاصيل الرسالة</label>
   <textarea id="supportText" maxlength="1000" rows="5" required></textarea>
   <button class="btn" type="submit">إرسال الرسالة</button>
  </form>
 </div>`;
}

async function sendSupport(event){
 event.preventDefault();
 try{
  const ref=db.ref("support/"+currentUser.uid).push();
  await ref.set({
   subject:document.getElementById("supportSubject").value.trim(),
   message:document.getElementById("supportText").value.trim(),
   status:"pending",
   createdAt:Date.now()
  });
  alert("تم إرسال رسالتك.");
  navigate("more");
 }catch(e){alert("تعذر إرسال الرسالة. تحقق من قواعد Firebase.");}
}

function renderPayments(){
 return `<h1>طريقة الدفع</h1>
 <div class="card">
  <p class="muted">يمكنك تحديد طريقة الدفع في كل طلب إيداع أو سحب.</p>
  <p class="muted">لا تحفظ كلمات مرور البنوك أو أرقام PIN أو رموز التحقق هنا.</p>
  <button class="btn" onclick="navigate('deposit')">طلب إيداع</button>
  <button class="btn secondary" onclick="navigate('withdraw')">طلب سحب</button>
 </div>`;
}

function renderAdmin(){
 if(!isAdmin)return `<h1>لوحة الإدارة</h1><div class="card">ليس لديك صلاحية الوصول.</div>`;

 const users=Object.entries(allUsers||{});
 const requests=Object.entries(allRequests||{}).flatMap(([uid,items])=>
  Object.entries(items||{}).map(([id,r])=>({uid,id,...r}))
 );
 const completions=Object.entries(allCompletions||{}).flatMap(([uid,items])=>
  Object.entries(items||{}).map(([id,t])=>({uid,id,...t}))
 );

 return `<h1>لوحة الإدارة</h1>
 <div class="notice">هذه اللوحة تعتمد على صلاحية المدير في قاعدة البيانات. راجع الطلبات قبل الموافقة، ولا تعدّل الأرصدة إلا بعد التحقق من المعاملة الفعلية.</div>

 <div class="grid">
  <div class="stat"><div class="label">المستخدمون</div><div class="value">${users.length}</div></div>
  <div class="stat"><div class="label">طلبات المحفظة</div><div class="value">${requests.length}</div></div>
  <div class="stat"><div class="label">إتمام المهام</div><div class="value">${completions.length}</div></div>
  <div class="stat"><div class="label">المهام</div><div class="value">${Object.keys(tasks).length}</div></div>
 </div>

 <div class="card">
  <h2>إضافة مهمة</h2>
  <form onsubmit="addTask(event)">
   <label>اسم المهمة</label><input id="taskTitle" required maxlength="100">
   <label>وصف المهمة</label><textarea id="taskDesc" required maxlength="500"></textarea>
   <label>المكافأة</label><input id="taskReward" type="number" min="0" max="100000" step="0.01" required>
   <button class="btn" type="submit">إضافة المهمة</button>
  </form>
 </div>

 <div class="card">
  <h2>إدارة المهام</h2>
  ${Object.entries(tasks).map(([id,t])=>`<div class="list-item">
   <div class="row"><b>${esc(t.title)}</b><span class="tag">${money(t.reward||0)}</span></div>
   <p class="muted">${esc(t.description||"")}</p>
   <button class="btn ${t.enabled===false?"secondary":"danger"} small" onclick="toggleTask('${esc(id)}',${t.enabled===false?"true":"false"})">${t.enabled===false?"تفعيل":"إيقاف"}</button>
   <button class="btn secondary small" onclick="deleteTask('${esc(id)}')">حذف</button>
  </div>`).join("")||'<div class="empty">لا توجد مهام.</div>'}
 </div>

 <div class="card">
  <h2>طلبات السحب والإيداع</h2>
  ${requests.map(r=>`<div class="list-item">
   <b>${r.type==="deposit"?"إيداع":"سحب"} — ${money(r.amount)}</b>
   <p class="muted">المستخدم: ${esc(r.uid)}<br>الطريقة: ${esc(r.method||"")}<br>الحالة: ${esc(statusText(r.status))}</p>
   <p class="muted">${esc(r.notes||"")}</p>
   <button class="btn small" onclick="updateRequest('${esc(r.uid)}','${esc(r.id)}','approved')">موافقة</button>
   <button class="btn danger small" onclick="updateRequest('${esc(r.uid)}','${esc(r.id)}','rejected')">رفض</button>
  </div>`).join("")||'<div class="empty">لا توجد طلبات.</div>'}
 </div>

 <div class="card">
  <h2>المستخدمون وإدارة الرصيد</h2>
  ${users.map(([uid,u])=>`<div class="list-item">
   <b>${esc(u.name||"مستخدم")}</b>
   <p class="muted">${esc(u.email||"")}<br>UID: ${esc(uid)}</p>
   <button class="btn secondary small" onclick="editBalance('${esc(uid)}')">إدارة الرصيد</button>
  </div>`).join("")||'<div class="empty">لا يوجد مستخدمون.</div>'}
 </div>

 <div class="card">
  <h2>إتمام المهام للمراجعة</h2>
  ${completions.map(t=>`<div class="list-item">
   <b>${esc(t.title||"مهمة")}</b>
   <p class="muted">المستخدم: ${esc(t.uid)}<br>المكافأة المطلوبة: ${money(t.reward||0)}<br>الحالة: ${esc(statusText(t.status))}</p>
   <button class="btn small" onclick="approveCompletion('${esc(t.uid)}','${esc(t.id)}')">اعتماد المهمة وإضافة المكافأة</button>
  </div>`).join("")||'<div class="empty">لا توجد مهام بانتظار المراجعة.</div>'}
 </div>`;
}

async function addTask(event){
 event.preventDefault();
 if(!isAdmin)return alert("غير مصرح.");
 const title=document.getElementById("taskTitle").value.trim();
 const description=document.getElementById("taskDesc").value.trim();
 const reward=Number(document.getElementById("taskReward").value);
 if(!title||!description||!Number.isFinite(reward)||reward<0)return;
 try{
  const ref=db.ref("tasks").push();
  await ref.set({title,description,reward,enabled:true,createdAt:Date.now()});
  alert("تمت إضافة المهمة.");
 }catch(e){alert("تعذر إضافة المهمة. تحقق من قواعد Firebase.");}
}

async function toggleTask(id,enabled){
 if(!isAdmin)return;
 try{await db.ref("tasks/"+id+"/enabled").set(enabled);}
 catch(e){alert("تعذر تغيير حالة المهمة.");}
}

async function deleteTask(id){
 if(!isAdmin||!confirm("هل تريد حذف هذه المهمة؟"))return;
 try{await db.ref("tasks/"+id).remove();}
 catch(e){alert("تعذر حذف المهمة.");}
}

async function updateRequest(uid,id,status){
 if(!isAdmin)return;
 try{
  await db.ref("requests/"+uid+"/"+id+"/status").set(status);
  alert("تم تحديث حالة الطلب. يجب مراجعة التحويل الفعلي قبل الموافقة على السحب.");
 }catch(e){alert("تعذر تحديث الطلب. تحقق من قواعد Firebase.");}
}

async function editBalance(uid){
 if(!isAdmin)return;
 const snap=await db.ref("balances/"+uid).once("value");
 const old=Number(snap.val()||0);
 const answer=prompt("الرصيد الحالي: "+old+"\nأدخل الرصيد الجديد بعد التحقق من العملية:",String(old));
 if(answer===null)return;
 const amount=Number(answer);
 if(!Number.isFinite(amount)||amount<0)return alert("المبلغ غير صحيح.");
 if(!confirm("تأكيد تغيير الرصيد إلى "+amount+"؟"))return;
 try{
  await db.ref("balances/"+uid).set(amount);
  alert("تم تحديث الرصيد.");
 }catch(e){alert("تعذر تحديث الرصيد. تحقق من قواعد Firebase.");}
}

async function approveCompletion(uid,id){
 if(!isAdmin)return;
 const ref=db.ref("taskCompletions/"+uid+"/"+id);
 try{
  const snap=await ref.once("value");
  const item=snap.val();
  if(!item)return alert("المهمة غير موجودة.");
  if(item.status==="approved")return alert("تم اعتماد المهمة سابقًا.");

  const balanceRef=db.ref("balances/"+uid);
  const result=await balanceRef.transaction(v=>Number(v||0)+Number(item.reward||0));
  if(!result.committed)return alert("تعذر تحديث الرصيد.");
  await ref.child("status").set("approved");
  alert("تم اعتماد المهمة وإضافة المكافأة.");
 }catch(e){alert("تعذر اعتماد المهمة. راجع قواعد قاعدة البيانات.");}
}
</script>
</body>
</html>
