
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Wallet - محفظتي</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#f2f5fa;color:#172033}
    header{background:#123c79;color:white;padding:22px 16px;text-align:center}
    header h1{margin:0 0 8px}
    main{max-width:600px;margin:22px auto;padding:0 14px}
    .card{background:white;padding:20px;border-radius:16px;margin-bottom:16px;box-shadow:0 4px 18px #12264a10}
    h2{font-size:19px;margin-top:0}
    label{display:block;margin:12px 0 6px}
    input,select,button{width:100%;padding:13px;border-radius:9px;border:1px solid #d5dbe6;font-size:16px}
    button{background:#1557b0;color:white;border:0;margin-top:12px;cursor:pointer}
    button.secondary{background:#e7eef9;color:#123c79}
    .balance{background:#123c79;color:white;text-align:center}
    .balance strong{font-size:30px;display:block;margin-top:12px}
    .muted{color:#68748a;font-size:13px;line-height:1.7}
    .hidden{display:none}
    #message{padding:12px;border-radius:8px;margin-bottom:14px;white-space:pre-wrap}
    .request{border-bottom:1px solid #eee;padding:12px 0;overflow-wrap:anywhere}
  </style>
</head>
<body>
<header>
  <h1>Smart Wallet</h1>
  <div>محفظتك الإلكترونية بالجنيه المصري</div>
</header>

<main>
  <div id="message" class="hidden"></div>

  <section id="auth" class="card">
    <h2 id="authTitle">تسجيل الدخول</h2>
    <label>رقم الموبايل</label>
    <input id="phone" inputmode="numeric" autocomplete="tel" placeholder="مثال: 01012345678">
    <label>كلمة المرور</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور">
    <button id="loginBtn">دخول</button>
    <button id="signupBtn" class="secondary">إنشاء حساب جديد</button>
    <p class="muted">الدخول يحتاج رقم الموبايل وكلمة المرور. لا تدخل بيانات بنكية أو كلمات مرور تستخدمها في مواقع أخرى.</p>
  </section>

  <section id="wallet" class="hidden">
    <div class="card balance">
      <div>رصيدك الحالي</div>
      <strong id="balance">0.00 ج.م</strong>
      <div id="userPhone"></div>
      <button id="logoutBtn" class="secondary">تسجيل الخروج</button>
    </div>

    <div class="card">
      <h2>طلب إيداع</h2>
      <label>المبلغ بالجنيه</label>
      <input id="depositAmount" type="number" min="1" step="0.01" placeholder="المبلغ">
      <label>طريقة الدفع</label>
      <select id="depositMethod">
        <option value="Vodafone Cash">فودافون كاش</option>
        <option value="Orange Cash">أورنج كاش</option>
        <option value="Etisalat Cash">اتصالات كاش</option>
        <option value="InstaPay">إنستاباي</option>
        <option value="Bank Transfer">تحويل بنكي</option>
      </select>
      <label>رقم التحويل أو مرجع العملية (اختياري)</label>
      <input id="depositRef" placeholder="رقم العملية">
      <button id="depositBtn">إرسال طلب الإيداع</button>
    </div>

    <div class="card">
      <h2>طلب سحب</h2>
      <label>المبلغ بالجنيه</label>
      <input id="withdrawAmount" type="number" min="1" step="0.01" placeholder="المبلغ">
      <label>طريقة الاستلام</label>
      <select id="withdrawMethod">
        <option value="Vodafone Cash">فودافون كاش</option>
        <option value="Orange Cash">أورنج كاش</option>
        <option value="Etisalat Cash">اتصالات كاش</option>
        <option value="InstaPay">إنستاباي</option>
        <option value="Bank Transfer">تحويل بنكي</option>
      </select>
      <label>رقم المحفظة أو وسيلة الاستلام</label>
      <input id="withdrawPhone" inputmode="numeric" placeholder="رقم الاستلام">
      <button id="withdrawBtn">إرسال طلب السحب</button>
      <p class="muted">إرسال الطلب لا يعني تنفيذ تحويل مالي. تتم المراجعة يدويًا.</p>
    </div>

    <div class="card">
      <h2>طلباتي</h2>
      <button id="refreshBtn" class="secondary">تحديث الطلبات والرصيد</button>
      <div id="requests">لم يتم تحميل الطلبات بعد.</div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://sjhjxbnhhwftwlkshpql.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_6880OlVMXwIDPJfqwFS5TA_m7FCMQZK";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);

function message(text, error=false) {
  $("message").textContent = text;
  $("message").classList.remove("hidden");
  $("message").style.background = error ? "#ffe8e8" : "#e5f7ec";
  $("message").style.color = error ? "#8c1717" : "#14532d";
}
function hideMessage(){ $("message").classList.add("hidden"); }
function normalizePhone(value){ return value.replace(/\D/g,""); }
function emailForPhone(phone){ return phone + "@phone.smartwallet.invalid"; }

async function loadWallet() {
  const {data:{user}} = await db.auth.getUser();
  if (!user) {
    $("auth").classList.remove("hidden");
    $("wallet").classList.add("hidden");
    return;
  }

  $("auth").classList.add("hidden");
  $("wallet").classList.remove("hidden");

  const {data:profile,error:profileError} = await db
    .from("profiles")
    .select("phone,balance")
    .eq("id",user.id)
    .maybeSingle();

  if(profileError) {
    message("تعذر تحميل الرصيد: " + profileError.message, true);
    return;
  }
  $("balance").textContent = Number(profile?.balance || 0).toFixed(2) + " ج.م";
  $("userPhone").textContent = profile?.phone || "";
  await loadRequests(user.id);
}

async function signUp() {
  hideMessage();
  const phone = normalizePhone($("phone").value);
  const password = $("password").value;
  if(!/^01[0125][0-9]{8}$/.test(phone)) {
    message("اكتب رقم موبايل مصري صحيحًا مكوّنًا من 11 رقمًا.",true); return;
  }
  if(password.length < 8) {
    message("كلمة المرور يجب أن تكون 8 أحرف على الأقل.",true); return;
  }

  const {data,error} = await db.auth.signUp({
    email: emailForPhone(phone),
    password,
    options:{data:{phone}}
  });
  if(error){message(error.message,true);return;}

  if(data.session) {
    message("تم إنشاء الحساب بنجاح.");
    await loadWallet();
  } else {
    message("تم إرسال طلب إنشاء الحساب. قد تحتاج إلى تأكيد البريد الوهمي من إعدادات Supabase قبل تسجيل الدخول. لا يتم إرسال رسالة SMS إلى هاتفك.");
  }
}

async function signIn() {
  hideMessage();
  const phone = normalizePhone($("phone").value);
  const password = $("password").value;
  if(!/^01[0125][0-9]{8}$/.test(phone) || !password) {
    message("اكتب رقم الموبايل وكلمة المرور بشكل صحيح.",true); return;
  }
  const {error} = await db.auth.signInWithPassword({
    email:emailForPhone(phone),password
  });
  if(error){message("تعذر تسجيل الدخول: " + error.message,true);return;}
  message("تم تسجيل الدخول.");
  await loadWallet();
}

async function sendRequest(type) {
  hideMessage();
  const {data:{user},error:authError} = await db.auth.getUser();
  if(authError || !user){message("سجّل الدخول أولًا.",true);return;}

  const isDeposit = type === "deposit";
  const amount = Number($(isDeposit ? "depositAmount" : "withdrawAmount").value);
  const method = $(isDeposit ? "depositMethod" : "withdrawMethod").value;
  const reference = isDeposit ? $("depositRef").value.trim() : $("withdrawPhone").value.trim();

  if(!Number.isFinite(amount) || amount <= 0) {
    message("اكتب مبلغًا صحيحًا أكبر من صفر.",true);return;
  }
  if(!isDeposit && !reference) {
    message("اكتب رقم وسيلة الاستلام.",true);return;
  }

  const request = {
    user_id:user.id,
    request_type:type,
    amount,
    payment_method:method,
    phone_number:isDeposit ? null : reference,
    reference:isDeposit ? (reference || null) : null,
    status:"pending"
  };

  const {error} = await db.from("wallet_requests").insert(request);
  if(error) {
    message("لم يتم إرسال الطلب: " + error.message,true);return;
  }
  message("تم إرسال الطلب للمراجعة. لم يتغير رصيدك.");
  $(isDeposit ? "depositAmount" : "withdrawAmount").value = "";
  if(isDeposit) $("depositRef").value = "";
  else $("withdrawPhone").value = "";
  await loadWallet();
}

async function loadRequests(userId) {
  const {data,error} = await db.from("wallet_requests")
    .select("id,request_type,amount,payment_method,status,created_at,admin_note")
    .eq("user_id",userId)
    .order("created_at",{ascending:false})
    .limit(30);

  if(error){$("requests").textContent="تعذر تحميل الطلبات: "+error.message;return;}
  $("requests").innerHTML = "";
  if(!data?.length){$("requests").textContent="لا توجد طلبات حتى الآن.";return;}

  for(const r of data) {
    const div = document.createElement("div");
    div.className="request";
    const type = r.request_type === "deposit" ? "إيداع" :
      (r.request_type === "withdraw" || r.request_type === "withdrawal") ? "سحب" : r.request_type;
    div.textContent = `${type} — ${Number(r.amount).toFixed(2)} ج.م — ${r.status} — ${r.payment_method || ""}`;
    if(r.admin_note) div.textContent += " — ملاحظة: " + r.admin_note;
    $("requests").appendChild(div);
  }
}

$("loginBtn").addEventListener("click",signIn);
$("signupBtn").addEventListener("click",signUp);
$("logoutBtn").addEventListener("click",async()=>{
  await db.auth.signOut();
  message("تم تسجيل الخروج.");
  await loadWallet();
});
$("depositBtn").addEventListener("click",()=>sendRequest("deposit"));
$("withdrawBtn").addEventListener("click",()=>sendRequest("withdraw"));
$("refreshBtn").addEventListener("click",loadWallet);

db.auth.onAuthStateChange((_event,session)=>{
  if(session) setTimeout(loadWallet,0);
});
loadWallet();
</script>
</body>
</html>
