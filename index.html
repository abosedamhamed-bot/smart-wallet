<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>منصتي PRO</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --cyan: #19d6e8;
  --navy: #080d20;
  --panel: #15213b;
  --text: #f7f8ff;
  --muted: #9da9c4;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 50% 15%,
      rgba(80, 45, 135, .42), transparent 52%),
    var(--navy);
  color: var(--text);
  font-family: Tahoma, Arial, sans-serif;
}

* {
  -webkit-tap-highlight-color: transparent;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
}

.wrapper {
  width: 100%;
  max-width: 600px;
  margin: auto;
  padding: 55px 16px 40px;
}

.brand {
  text-align: center;
  font-size: 30px;
  font-weight: bold;
  margin-bottom: 25px;
}

.brand span {
  color: var(--cyan);
  direction: ltr;
  display: inline-block;
}

.tagline {
  text-align: center;
  color: var(--muted);
  font-size: 14px;
  margin: 0 0 40px;
}

.auth-card {
  background: linear-gradient(
    140deg,
    rgba(24, 38, 65, .98),
    rgba(17, 26, 48, .98)
  );
  border: 1px solid rgba(150, 170, 220, .14);
  border-radius: 25px;
  padding: 25px 24px;
  box-shadow: 0 18px 55px rgba(0, 0, 0, .15);
}

h2 {
  font-size: 21px;
  margin: 0 0 30px;
}

label {
  display: block;
  color: #bac5dc;
  font-size: 14px;
  margin: 0 0 13px;
}

input {
  display: block;
  width: 100%;
  height: 58px;
  padding: 0 16px;
  background: #080f23;
  border: 1px solid #283657;
  border-radius: 15px;
  color: white;
  outline: none;
  margin-bottom: 22px;
  direction: ltr;
  text-align: right;
}

input:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 0 2px rgba(25, 214, 232, .08);
}

input[type="tel"] {
  text-align: left;
}

.primary {
  display: block;
  width: 100%;
  height: 66px;
  border: none;
  border-radius: 15px;
  color: #061a29;
  background: linear-gradient(90deg, #19cfe4, #50eee0);
  font-size: 19px;
  font-weight: bold;
  margin-top: 4px;
}

.primary:active {
  transform: scale(.99);
}

.switch {
  text-align: center;
  font-size: 13px;
  color: var(--muted);
  margin: 26px 0 0;
}

.switch button {
  color: var(--cyan);
  background: transparent;
  border: none;
  padding: 0;
}

.message {
  display: none;
  margin-top: 20px;
  font-size: 13px;
  line-height: 1.8;
  overflow-wrap: anywhere;
}

.message.show {
  display: block;
}

.message.error {
  color: #ff9999;
}

.message.success {
  color: #6df0bd;
}

.disclaimer {
  text-align: center;
  font-size: 12px;
  line-height: 2;
  color: var(--muted);
  margin: 20px 5px 0;
}

.hidden {
  display: none !important;
}

@media (max-width: 400px) {
  .wrapper {
    padding-top: 38px;
  }

  .auth-card {
    padding: 22px 17px;
  }

  .brand {
    font-size: 27px;
  }
}
</style>
</head>

<body>
<main class="wrapper">

  <header>
    <div class="brand">منصتي <span>PRO</span></div>
    <p class="tagline">المهام والعمولات في مكان واحد</p>
  </header>

  <section class="auth-card">

    <form id="loginForm">
      <h2>تسجيل الدخول 👋</h2>

      <label for="loginPhone">رقم الهاتف</label>
      <input
        id="loginPhone"
        type="tel"
        inputmode="tel"
        autocomplete="tel"
        placeholder="أدخل رقم الهاتف"
        required
      >

      <label for="loginPassword">كلمة المرور</label>
      <input
        id="loginPassword"
        type="password"
        autocomplete="current-password"
        placeholder="أدخل كلمة المرور"
        required
      >

      <button class="primary" type="submit">
        تسجيل الدخول
      </button>

      <p class="switch">
        ليس لديك حساب؟
        <button type="button" id="showRegister">
          إنشاء حساب جديد
        </button>
      </p>

      <div id="loginMessage" class="message"></div>
    </form>

    <form id="registerForm" class="hidden">
      <h2>إنشاء حساب جديد ✨</h2>

      <label for="registerName">الاسم</label>
      <input
        id="registerName"
        type="text"
        autocomplete="name"
        placeholder="اكتب اسمك"
        required
      >

      <label for="registerPhone">رقم الهاتف</label>
      <input
        id="registerPhone"
        type="tel"
        inputmode="tel"
        autocomplete="tel"
        placeholder="أدخل رقم الهاتف"
        required
      >

      <label for="registerPassword">كلمة المرور</label>
      <input
        id="registerPassword"
        type="password"
        autocomplete="new-password"
        minlength="8"
        placeholder="8 أحرف على الأقل"
        required
      >

      <button class="primary" type="submit">
        إنشاء حساب
      </button>

      <p class="switch">
        لديك حساب بالفعل؟
        <button type="button" id="showLogin">
          تسجيل الدخول
        </button>
      </p>

      <div id="registerMessage" class="message"></div>
    </form>

  </section>

  <p class="disclaimer">
    هذه واجهة تسجيل الدخول الأولية. يلزم ربط قاعدة بيانات
    لتسجيل الحسابات وحفظها بشكل آمن.
  </p>

</main>

<script>
const loginForm = document.getElementById("loginForm");
const registerForm = document.getElementById("registerForm");

document.getElementById("showRegister").onclick = () => {
  loginForm.classList.add("hidden");
  registerForm.classList.remove("hidden");
};

document.getElementById("showLogin").onclick = () => {
  registerForm.classList.add("hidden");
  loginForm.classList.remove("hidden");
};

function showMessage(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = "message show " + type;
}

loginForm.addEventListener("submit", event => {
  event.preventDefault();

  showMessage(
    "loginMessage",
    "لم يتم ربط قاعدة البيانات بعد. سنفعّل تسجيل الدخول بعد إعداد PocketBase.",
    "error"
  );
});

registerForm.addEventListener("submit", event => {
  event.preventDefault();

  const phone = document.getElementById("registerPhone").value.trim();
  const password = document.getElementById("registerPassword").value;

  if (!/^\+?[0-9]{8,15}$/.test(phone.replace(/[\s()-]/g, ""))) {
    showMessage(
      "registerMessage",
      "يرجى إدخال رقم هاتف صحيح.",
      "error"
    );
    return;
  }

  if (password.length < 8) {
    showMessage(
      "registerMessage",
      "كلمة المرور يجب أن تكون 8 أحرف على الأقل.",
      "error"
    );
    return;
  }

  showMessage(
    "registerMessage",
    "الواجهة جاهزة، لكن إنشاء الحساب لن يعمل قبل ربط PocketBase.",
    "error"
  );
});
</script>
</body>
</html>
