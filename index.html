<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Wallet - محفظتي</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: #fff;
    }

    button, input, select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .container {
      width: min(100% - 28px, 520px);
      margin: auto;
      padding: 22px 0 40px;
    }

    .brand {
      text-align: center;
      margin: 12px 0 28px;
    }

    .brand h1 {
      color: #48dfb0;
      margin-bottom: 8px;
    }

    .card {
      background: #1b2638;
      border: 1px solid #2d3a50;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
    }

    h2, h3 {
      margin-top: 0;
    }

    label {
      display: block;
      margin: 14px 0 8px;
      color: #d8e1ee;
    }

    input, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #3a4960;
      border-radius: 10px;
      background: #101827;
      color: #fff;
      outline: none;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #38d9a9;
      color: #09251d;
      font-weight: bold;
      margin-top: 16px;
    }

    .btn.secondary {
      background: #2b3a50;
      color: white;
    }

    .btn.danger {
      background: #c84e5d;
      color: white;
    }

    .hidden {
      display: none !important;
    }

    .balance {
      text-align: center;
      padding: 28px 10px;
    }

    .balance small {
      color: #bdc9d9;
    }

    .balance strong {
      display: block;
      font-size: 35px;
      margin-top: 12px;
      color: #48dfb0;
      overflow-wrap: anywhere;
    }

    .menu {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .menu button {
      padding: 16px 8px;
      background: #27354a;
      color: white;
      border: 1px solid #35455e;
      border-radius: 12px;
    }

    .notice {
      padding: 12px;
      border-radius: 10px;
      background: #26364c;
      color: #dce7f5;
      line-height: 1.7;
      margin-top: 12px;
    }

    .status {
      margin-top: 14px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .item {
      padding: 13px 0;
      border-bottom: 1px solid #344258;
      line-height: 1.8;
    }

    .item:last-child {
      border-bottom: 0;
    }

    .muted {
      color: #b8c5d8;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main class="container">

    <header class="brand">
      <h1>Smart Wallet</h1>
      <p>محفظتك الإلكترونية</p>
    </header>

    <!-- تسجيل الدخول -->
    <section id="loginPage" class="card">
      <h2>تسجيل الدخول</h2>
      <p class="muted">أدخل رقم الموبايل للمتابعة.</p>

      <form id="loginForm">
        <label for="phone">رقم الموبايل المصري</label>
        <input
          id="phone"
          type="tel"
          inputmode="numeric"
          autocomplete="tel"
          placeholder="01xxxxxxxxx"
          maxlength="11"
          required
        >

        <button class="btn" type="submit">دخول</button>
      </form>

      <div id="loginMessage" class="status" role="status"></div>

      <div class="notice">
        الدخول بالرقم وحده لا يثبت ملكية الحساب. هذه الواجهة لا تسمح
        باستخدامها لإثبات ملكية رصيد مالي أو إجراء سحب حقيقي.
      </div>
    </section>

    <!-- الصفحة الرئيسية -->
    <section id="homePage" class="hidden">

      <div class="card balance">
        <small>الرصيد المسجل في هذه الجلسة</small>
        <strong id="balance">0.00 ج.م</strong>
        <p id="userPhone" class="muted"></p>
      </div>

      <div class="card">
        <h3>الخدمات</h3>

        <div class="menu">
          <button type="button" data-page="depositPage">
            طلب إيداع
          </button>

          <button type="button" data-page="withdrawPage">
            طلب سحب
          </button>

          <button type="button" data-page="historyPage">
            سجل العمليات
          </button>

          <button type="button" id="refreshButton">
            تحديث البيانات
          </button>
        </div>

        <button class="btn secondary" id="logoutButton" type="button">
          تسجيل الخروج
        </button>
      </div>
    </section>

    <!-- الإيداع -->
    <section id="depositPage" class="card hidden">
      <h2>طلب إيداع</h2>

      <form id="depositForm">
        <label for="depositAmount">المبلغ بالجنيه المصري</label>
        <input
          id="depositAmount"
          type="number"
          min="1"
          step="0.01"
          required
        >

        <label for="depositMethod">طريقة الإيداع</label>
        <select id="depositMethod" required>
          <option value="">اختر الطريقة</option>
          <option value="vodafone_cash">فودافون كاش</option>
          <option value="orange_cash">أورنج كاش</option>
          <option value="etisalat_cash">اتصالات كاش</option>
          <option value="instapay">إنستا باي</option>
          <option value="visa">بطاقة بنكية</option>
        </select>

        <button class="btn" type="submit">إرسال طلب الإيداع</button>
      </form>

      <div id="depositMessage" class="status" role="status"></div>
      <button class="btn secondary backButton" type="button">رجوع</button>
    </section>

    <!-- السحب -->
    <section id="withdrawPage" class="card hidden">
      <h2>طلب سحب</h2>

      <form id="withdrawForm">
        <label for="withdrawAmount">المبلغ بالجنيه المصري</label>
        <input
          id="withdrawAmount"
          type="number"
          min="1"
          step="0.01"
          required
        >

        <label for="withdrawMethod">طريقة استلام المبلغ</label>
        <select id="withdrawMethod" required>
          <option value="">اختر الطريقة</option>
          <option value="vodafone_cash">فودافون كاش</option>
          <option value="orange_cash">أورنج كاش</option>
          <option value="etisalat_cash">اتصالات كاش</option>
          <option value="instapay">إنستا باي</option>
          <option value="visa">بطاقة بنكية</option>
        </select>

        <label for="destination">رقم أو بيانات الاستلام</label>
        <input id="destination" type="text" maxlength="100" required>

        <button class="btn" type="submit">إرسال طلب السحب</button>
      </form>

      <div id="withdrawMessage" class="status" role="status"></div>
      <button class="btn secondary backButton" type="button">رجوع</button>
    </section>

    <!-- سجل العمليات -->
    <section id="historyPage" class="card hidden">
      <h2>سجل العمليات</h2>

      <div id="historyList">
        <p class="muted">لا توجد بيانات محمّلة.</p>
      </div>

      <button class="btn secondary backButton" type="button">رجوع</button>
    </section>

  </main>

  <script>
    "use strict";

    /*
      هذه واجهة فقط في الوقت الحالي.
      لا يوجد اتصال بخادم المستخدمين في هذا الملف.
      لا يتم حفظ أرصدة مالية أو اعتماد طلبات حقيقية في المتصفح.
    */

    const $ = (id) => document.getElementById(id);

    let currentPhone = "";

    const pageIds = [
      "loginPage",
      "homePage",
      "depositPage",
      "withdrawPage",
      "historyPage"
    ];

    function showPage(pageId) {
      for (const id of pageIds) {
        $(id).classList.toggle("hidden", id !== pageId);
      }
    }

    function normalizePhone(value) {
      return value.replace(/\D/g, "");
    }

    function validEgyptianPhone(value) {
      return /^01[0125][0-9]{8}$/.test(value);
    }

    function formatMoney(value) {
      return Number(value).toLocaleString("ar-EG", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }) + " ج.م";
    }

    function showMessage(elementId, message) {
      $(elementId).textContent = message;
    }

    $("loginForm").addEventListener("submit", (event) => {
      event.preventDefault();

      const phone = normalizePhone($("phone").value);

      if (!validEgyptianPhone(phone)) {
        showMessage(
          "loginMessage",
          "أدخل رقم موبايل مصري صحيحًا مكوّنًا من 11 رقمًا."
        );
        return;
      }

      /*
        لا ننشئ حسابًا ماليًا ولا نعرض رصيدًا بمجرد كتابة الرقم.
        يجب ربط هذا الجزء بخادم يتحقق من صلاحية الوصول للحساب.
      */
      showMessage(
        "loginMessage",
        "تم التحقق من شكل الرقم فقط. تسجيل الدخول الفعلي يحتاج إلى ربط آمن بالخادم."
      );
    });

    document.querySelectorAll("[data-page]").forEach((button) => {
      button.addEventListener("click", () => {
        showPage(button.dataset.page);
      });
    });

    document.querySelectorAll(".backButton").forEach((button) => {
      button.addEventListener("click", () => {
        showPage("homePage");
      });
    });

    $("depositForm").addEventListener("submit", (event) => {
      event.preventDefault();

      showMessage(
        "depositMessage",
        "لم يُرسل الطلب: ربط الخادم لم يُستكمل بعد."
      );
    });

    $("withdrawForm").addEventListener("submit", (event) => {
      event.preventDefault();

      showMessage(
        "withdrawMessage",
        "لم يُرسل الطلب: ربط الخادم لم يُستكمل بعد."
      );
    });

    $("refreshButton").addEventListener("click", () => {
      showMessage(
        "loginMessage",
        "لم يتم ربط جلب الرصيد بالخادم بعد."
      );

      showPage("loginPage");
    });

    $("logoutButton").addEventListener("click", () => {
      currentPhone = "";
      $("phone").value = "";
      showPage("loginPage");
    });
  </script>
</body>
</html>
